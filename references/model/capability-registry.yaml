schema_version: 1
model_family: Seedance 2.5
authority: user_confirmed
scope: compiler_domain
provenance:
  seed_material: action-fusion capability evidence and workflow notes
  resolution: user-confirmed contracts supersede uncertainty in the seed material
  runtime_dependency: none

hard_contracts:
  segment_duration_seconds:
    minimum: 4
    maximum: 30
    applies_to: one_generated_segment

  reference_assets:
    maximum_total: 50
    counting_rule: image_video_audio_combined
    applies_to: one_generated_segment

  formal_reference_placeholders:
    image: "@imageN"
    video: "@videoN"
    audio: "@audioN"
    numbering: first_use_per_type_from_1_for_new_prompt_preserve_mapping_for_augmentation
    occurrence: once_per_unique_source
    location: "素材绑定"
    source_locator_output: forbidden

  boundary_states:
    purpose: readable_entry_and_exit_or_continuing_action_phase
    fixed_hold_duration: none

output_format:
  style: six-part-shot-prose
  authority: user_output_preference_not_model_mechanism
  order:
    - "风格"
    - "素材绑定"
    - "全局约束"
    - "本段戏剧任务"
    - "本段情绪总控"
    - "镜头 blocks"
  shot_heading: "镜头N｜M:SS-M:SS"
  shot_title_timing: coarse_editorial_budget_not_exact_execution
  shot_body_timing: event_phrase_and_emotional_triggers_no_numeric_execution_schedule
  exact_time_in_story_text: preserve_original_dialogue_and_visible_text
  shot_body: one_continuous_prose_paragraph
  required_shot_sentences: ["光影", "现场声"]
  dialogue:
    placement: inline_in_shot_prose_at_speaking_moment
    quotation: chinese_double_quotes
    example: '角色看着对手，语气平稳地说：“逐字原文”'
    optional: true
    performance_default: outside_quotes
    internal_annotation: '【非发声表演说明】'
    internal_annotation_when: only_a_longer_utterance_with_a_needed_mid_line_change
    length_alone_requires_annotation: false
    spoken_text: exact_original_after_excluding_nonspoken_annotations
    source_identity: explicit_character_offscreen_narration_or_device
    prop_text_quotes: not_automatically_speech
    authority: user_writing_preference_not_platform_guarantee
  no_assets_text: "无外部参考素材"
  global_constraints:
    scope: established_segment_shared_facts_with_scoped_exceptions
    no_extra_text: "无额外全局约束。"
    asset_tokens: forbidden
    opening_spatial_baseline: initial_only_then_updated_by_narrated_movement
    shot_composition: project_previous_world_state_through_current_camera
    dynamic_staging: retained_in_relevant_shot_prose
  ending: last_shot_onset_sound_sentence
  self_check_section: forbidden
  character_limit: unknown
  new_design_style:
    adjacent_cuts: chosen_for_information_performance_and_continuity_not_parameter_alternation
    composition: chosen_for_relationships_and_visibility_centered_or_off_center_as_needed
    priority: explicit_user_locks_and_approved_L1_first
    continuous_take: preserve_no_manufactured_cuts

unknown_field_policy:
  - Do not infer numeric reference weights.
  - Do not infer token or character limits.
  - Do not infer camera-control parameters.
  - Do not infer a separate negative-prompt field.
  - Do not infer switches, guarantees, or capabilities absent from this registry.
