$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://local.codex/seedance-2-5-director-compiler/director-ir.schema.yaml"
title: "Seedance 2.5 Director IR"
description: "Locked director decisions passed to the native shot-prompt compiler; no platform syntax lives here."
type: object
additionalProperties: false
required:
  - meta
  - authority
  - drama
  - continuity
  - visual_strategy
  - knowledge_applications
  - shots
  - action
  - approval
properties:
  meta:
    type: object
    additionalProperties: false
    required: [segment_id, l1_version, duration_s, task_mode, action_mode]
    properties:
      segment_id:
        type: string
        minLength: 1
        description: "One generation segment; it may contain multiple camera shots."
      l1_version:
        type: integer
        minimum: 1
      duration_s:
        type: number
        minimum: 4
        maximum: 30
      task_mode:
        enum: [CREATE_AUTO, DIRECTOR_CHECKPOINT, COMPILE, SEQUENCE, OPTIMIZE, DIAGNOSE, AUDIT]
        description: "New records keep the actual task path for each segment. Multi-segment execution is a scope, not a replacement approval policy. SEQUENCE remains a legacy value for an explicit multi-segment request or a locked minimum span exceeding 30 seconds; recover the actual path and confirmation policy from the current request and approval.status."
      action_mode:
        enum: [NARRATIVE, ACTION_LITE, ACTION_FULL]

  authority:
    type: object
    additionalProperties: false
    required: [user_locks, story_facts, exact_dialogue, reference_assets, assumptions]
    properties:
      user_locks:
        type: array
        items: {type: string}
      story_facts:
        type: array
        items: {type: string}
      exact_dialogue:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [speaker, text]
          oneOf:
            - required: [shot_id]
            - required: [fragments]
          properties:
            speaker: {type: string, minLength: 1}
            text: {type: string, minLength: 1, description: "仅实际发声原文，含原标点；非发声表演说明留delivery，编译时不改变此原文"}
            shot_id: {type: string, minLength: 1, description: "单镜完整发声时使用，引用shots.id；跨镜使用fragments，不同时填写shot_id"}
            fragments:
              type: array
              minItems: 1
              description: "跨镜的逐镜发声分配；按发声顺序拼接text须逐字等于本条完整原文，shot_id引用已确认shots.id，不改切点或增补停顿"
              items:
                type: object
                additionalProperties: false
                required: [shot_id, text]
                properties:
                  shot_id: {type: string, minLength: 1}
                  text: {type: string, minLength: 1}
            delivery: {type: string}
      reference_assets:
        type: array
        maxItems: 50
        items:
          type: object
          additionalProperties: false
          required: [source_ref, type, binds_to, purpose]
          properties:
            source_ref: {type: string, minLength: 1}
            type: {enum: [image, video, audio]}
            output_placeholder:
              type: string
              pattern: '^@(image|video|audio)[1-9][0-9]*$'
              description: "Optional existing canonical source-to-placeholder mapping; preserve its media type, number and gaps. Omit for a genuinely new source until compilation assigns the next number of that media type."
            binds_to: {type: string, minLength: 1}
            purpose: {type: string, minLength: 1}
      assumptions:
        type: array
        items: {type: string}

  drama:
    type: object
    additionalProperties: false
    required: [premise, objective, obstacle, turn, audience_landing]
    properties:
      premise: {type: string, minLength: 1}
      objective: {type: string, minLength: 1}
      obstacle: {type: string, minLength: 1}
      turn: {type: string, minLength: 1}
      audience_landing: {type: string, minLength: 1}

  continuity:
    type: object
    additionalProperties: false
    required: [entry_state, exit_state]
    properties:
      entry_state: {type: string, minLength: 1}
      exit_state: {type: string, minLength: 1, description: "Planned endpoint of this design, not evidence of a rendered take. For a dependent segment, derive entry_state from the selected take or its confirmed actual state."}

  visual_strategy:
    type: object
    additionalProperties: false
    required: [viewpoint, master_shot_logic, rhythm, look_and_sound]
    properties:
      viewpoint: {type: string, minLength: 1}
      master_shot_logic: {type: string, minLength: 1}
      rhythm:
        type: string
        minLength: 1
        description: "已有节奏曲线、主情绪的节奏与温度；输出本段目标的情绪方向从此投影，不新增属性"
      look_and_sound:
        type: string
        minLength: 1
        description: "全段成像质感、光色与现场声策略、已定情绪边界及藏露选择；固定世界灯位/照向/色光/反差归环境，具体镜内受光关系保留在image_action；镜头焦距逐镜写camera"

  knowledge_applications:
    type: array
    description: "Director tasks require at least one applied source; compile-only inputs may supply an empty list."
    items:
      type: object
      additionalProperties: false
      required: [source, principle, transformation, applied_to]
      properties:
        source: {type: string, minLength: 1}
        principle: {type: string, minLength: 1}
        transformation: {type: string, minLength: 1}
        applied_to:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}

  shots:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - time
        - function
        - image_action
        - camera
        - staging
        - performance
        - sound
        - transition
        - end_state
      properties:
        id: {type: string, minLength: 1}
        time: {type: string, pattern: "^\\d{2}:\\d{2}\\.\\d-\\d{2}:\\d{2}\\.\\d$"}
        function: {type: string, minLength: 1}
        image_action:
          type: string
          minLength: 1
          description: "本镜连续画面主干：具体起始构图、人物行动与听说互动、摄影响应及结果；持续行为、已选表演和受光关系在实际发生处成立，其他字段是同一决定的依据而非另一版动作"
        camera:
          type: string
          minLength: 1
          description: "足够执行事件的简洁景别/焦距、相对机位、必要构图和运动/固定状态；光学可见结果与摄影机响应服务人物过程"
        staging:
          type: string
          minLength: 1
          description: "由世界锚与当前机位推导起始画面：人物/关键物的画左画右、实际前中后景、裁切遮挡、注意力与出入画；行动引起的重排写image_action，镜尾交end_state"
        performance:
          type: string
          minLength: 1
          description: "策略及触发式习惯落成持续行为、注意力、听说互动与反应；按可见性取舍，继承身体条件而非只列情绪关键帧"
        sound:
          type: string
          minLength: 1
          description: "实际声源、远近与发生时机，编译到声音发生处，共享底声归声音块；对白触发、逐字文本与反应编译到同一镜头事件中；双引号对白之外默认承载情绪与动作，长对白中途说明为条件式非发声标注"
        transition:
          type: string
          minLength: 1
          description: "切点或镜内连续的因果承接，包含前一状态结果与新视点首个可见状态"
        end_state: {type: string, minLength: 1, description: "接续依据，包含仍有效的画外状态；不要求逐字段印成镜尾清单，后镜保留事实并仅叙述当前可见可听及影响动作的部分"}

  action:
    oneOf:
      - type: "null"
      - type: object
        additionalProperties: false
        required: [dramatic_meaning, tactical_goal, spatial_directions, beats, resulting_state]
        properties:
          dramatic_meaning: {type: string, minLength: 1}
          tactical_goal: {type: string, minLength: 1}
          spatial_directions: {type: string, minLength: 1}
          beats:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              description: "一个可含重叠攻防的交锋单元；只序列化当前有意义的接触、惯性、恢复与精确时间，恢复可接入下一次行动而非停稳。"
              required: [cause, motion, shot_id]
              properties:
                time: {type: string, minLength: 1}
                cause: {type: string, minLength: 1}
                motion: {type: string, minLength: 1}
                contact: {type: string, minLength: 1}
                inertia: {type: string, minLength: 1}
                recovery: {type: string, minLength: 1}
                concurrent_pressure: {type: string, minLength: 1}
                shot_id: {type: string, minLength: 1}
          resulting_state: {type: string, minLength: 1}

  approval:
    type: object
    additionalProperties: false
    required: [status, compiled_from_version]
    properties:
      status:
        enum: [draft, turn_locked, user_approved, revision_requested]
      compiled_from_version:
        oneOf:
          - type: integer
            minimum: 1
          - type: "null"
